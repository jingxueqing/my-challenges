# 挑战定义（Challenge Domain Config）
# 来源：桌面《我的挑战》下 20 份官方 CHALLENGE.md / challenge.json（真实课程配置，非杜撰）
# 编辑说明：新增挑战只改这里，代码不用动。文件名匹配用的是 naming.regex。

meta:
  semester: 2026 秋
  class: AI+X 实验班 Elite20
  spec_version: 1
  updated: 2026-11-04

# 文件名规范：姓名_挑战ID_内容.md  →  JingXueQing_C8_proposal.md
# 也兼容真实提交里出现的：JingXueQing_C4A_skill-evaluator.skill、C2G-交付_JingXueQing_参数高尔夫/
naming:
  regex: '^(?P<student>[^_/]+?)_(?P<challenge>C\d+[A-Z]{0,2})_(?P<kind>[^_/]+?)(?:\.[A-Za-z0-9]+)?$'
  # kind 别名归一化：把各种写法映射到标准 artifact kind
  kind_aliases:
    proposal: [proposal, 申请书, g1]
    demo: [demo, 原型, prototype]
    ailog: [AI日志, ai日志, ailog, AI_LOG, ai-log]
    notes: [拿来说明, 参考, 引用, references]
    aar: [AAR, aar, 复盘]
    deliverable: [交付物, 方案设计, report, 报告, repo链接, app链接, 教学说明, 数据说明]

# 默认要求：每个挑战至少要有主交付物 + AI 日志（课程硬规则：过程留痕）
defaults:
  required: [deliverable, ailog]

